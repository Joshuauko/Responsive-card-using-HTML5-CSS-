<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <section class="card-section">
      <div class="container card-container">
        <div class="card-row">
          <div>
            <img
              class="card-heading-img"
              src="./assets/images/illustration-article.svg"
              alt="An image illustrating an html tag"
            />
          </div>
          <div class="card-header-div">
            <h3 class="card-title">Learning</h3>
          </div>
          <p class="card-badge">Published 21 Dec 2023</p>

          <h1 class="card-header">HTML & CSS foundations</h1>

          <p class="card-description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>

          <div class="card-icon-img">
            <!-- <div> -->
            <img
              class="icon-img"
              src="./assets/images/image-avatar.webp"
              alt="An image of a guy"
            />
            <!-- </div> -->
            <div class="icon-text">
              <p>Greg Hooper</p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <footer class="card-footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Joshua Uko</a>.
    </footer>
  </body>
</html>
